92b"/><text x="394.4" y="207.0" font-size="12.5" fill="#1d2433">326명</text><text x="222" y="233.0" text-anchor="end" font-size="13" fill="#1d2433">9. 시민회관</text><rect x="230" y="220" width="145.4" height="16" rx="3" fill="#e8892b"/><text x="381.4" y="233.0" font-size="12.5" fill="#1d2433">299명</text><text x="222" y="259.0" text-anchor="end" font-size="13" fill="#1d2433">10. 용천마을</text><rect x="230" y="246" width="127.4" height="16" rx="3" fill="#e8892b"/><text x="363.4" y="259.0" font-size="12.5" fill="#1d2433">262명</text></svg>